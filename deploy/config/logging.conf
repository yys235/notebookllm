# ============================================================================
# Team1 Fullstack Application - Python Logging Configuration
# ============================================================================
# This file defines the logging configuration for the FastAPI backend.
#
# Usage in uvicorn:
#   uvicorn --log-config logging.conf main:app
# ============================================================================

[loggers]
keys=root,uvicorn,uvicorn.access,uvicorn.error,team1

[handlers]
keys=default,access,error,file

[formatters]
keys=default,access,json

[logger_root]
level=INFO
handlers=default

[logger_uvicorn]
level=INFO
handlers=default
propagate=0
qualname=uvicorn

[logger_uvicorn.access]
level=INFO
handlers=access
propagate=0
qualname=uvicorn.access

[logger_uvicorn.error]
level=INFO
handlers=
propagate=0
qualname=uvicorn.error

[logger_team1]
level=INFO
handlers=default,file
propagate=0
qualname=team1

[handler_default]
class=StreamHandler
formatter=default
args=(sys.stdout,)

[handler_access]
class=StreamHandler
formatter=access
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
formatter=json
args=('/var/log/team1/backend.log', 'a', 10485760, 5)

[formatter_default]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
format=%(asctime)s - %(client)s - %(request_line)s %(status_code)s
class=logging.Formatter

[formatter_json]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(message)s %(pathname)s %(lineno)d %(funcName)s
