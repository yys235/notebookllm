# ============================================================================
# Team1 Fullstack Application - Logrotate Configuration
# ============================================================================
# This configuration manages log rotation for application logs.
#
# Installation:
#   sudo cp logrotate.conf /etc/logrotate.d/team1
#
# Testing:
#   sudo logrotate -d /etc/logrotate.d/team1
#   sudo logrotate -f /etc/logrotate.d/team1
# ============================================================================

# Application logs
/var/log/team1/*.log {
    # Rotate daily
    daily

    # Keep logs for 30 days
    rotate 30

    # Compress old logs
    compress
    delaycompress

    # Don't rotate if log is empty
    notifempty

    # Create new log file with permissions
    create 0640 team1 adm

    # Don't show error if log file is missing
    missingok

    # Truncate log file after rotation
    # copytruncate

    # Post-rotation command
    postrotate
        # Send signal to application to reopen log files
        # systemctl reload team1-backend.service >/dev/null 2>&1 || true
    endscript
}

