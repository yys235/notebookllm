# ============================================================================
# Team1 Fullstack Application - Nginx Configuration
# ============================================================================
# This configuration handles:
# - Reverse proxy for FastAPI backend
# - Static file serving for Vue.js frontend
# - WebSocket support for real-time features
# - SSL/TLS termination (when configured)
# - Rate limiting and security headers
# ============================================================================

# Rate limiting zone
# Limits requests to 10 per second per IP address
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream configuration for FastAPI backend
upstream backend {
    # Use keepalive connections for better performance
    server 127.0.0.1:8000;
    keepalive 32;
}

# Cache zone for static assets
proxy_cache_path /var/cache/nginx/team1 levels=1:2 keys_zone=team1_cache:10m max_size=100m inactive=60m;

# Redirect HTTP to HTTPS (uncomment when SSL is configured)
# server {
#     listen 80;
#     listen [::]:80;
